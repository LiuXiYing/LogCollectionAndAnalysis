server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;
    location = / {
        return 200 "loglab nginx demo\n";
    }
    location = /api/ok {
        return 200 '{"status":"ok"}';
    }
    location / {
        return 404 '{"error":"not found"}';
    }
}
