version: 1

course:
  name: 日志收集与分析
  timezone: Asia/Shanghai
  title_template: "[{student_id}{student_name}]{assignment_id}作业提交"
  submission_path_template: "{student_id}{student_name}/{assignment_id}"
  merge_method: merge

features:
  auto_merge: true
  comment_review: true
  close_late_pr: true
  ai_review: true
  ai_feedback: true
  ocr_review: false
  vision_review: true
  metrics: true

defaults:
  min_nonempty_lines: 10
  allow_extra_files: false
  late_close_after_days: 7

ai:
  providers:
    - provider: glm
      model: glm-4.7-flash
    - provider: gemini
      model: gemini-3.5-flash-lite
  consensus_rounds: 3
  min_confidence: 0.8
  timeout_seconds: 60
  max_attempts: 5
  max_file_bytes: 200000
  max_total_bytes: 500000
  max_output_tokens: 2048

feedback:
  timeout_seconds: 20
  max_input_bytes: 100000
  max_output_tokens: 2048

ocr:
  detection_model: PP-OCRv6_small_det
  recognition_model: PP-OCRv6_small_rec
  min_line_confidence: 0.65
  max_text_chars: 20000

vision:
  providers:
    - provider: glm
      model: glm-4.1v-thinking-flash
    - provider: gemini
      model: gemini-3.5-flash-lite
  consensus_rounds: 3
  min_confidence: 0.85
  fail_confidence: 0.9
  timeout_seconds: 90
  max_attempts: 5
  max_images: 6
  max_image_bytes: 5000000
  max_total_bytes: 12000000
  max_pixels: 25000000
  max_side: 4096
  max_output_tokens: 4096

# 发布作业时在这里追加 Lab1、Lab2 等配置。
# required_files 为精确文件名，不支持通配符；vision_files 支持 fnmatch 通配符。
assignments:
  Lab1:
    deadline: "2026-09-10T23:59:59+08:00"
    required_files:
      - Lab1.md
      - imgs/lab1-vmware-version.png
      - imgs/lab1-ubuntu-version.png
      - imgs/lab1-network.png
      - imgs/lab1-resources.png
      - imgs/lab1-services.png
    vision_files:
      - imgs/lab1-vmware-version.png
      - imgs/lab1-ubuntu-version.png
      - imgs/lab1-network.png
      - imgs/lab1-resources.png
      - imgs/lab1-services.png
    review_points:
      - 任务一：VMware 版本应为 VMware Workstation Pro 26H1 for Windows。
      - 任务二：Ubuntu 应为 24.04 LTS Desktop，处理器架构为 x86_64，安装介质版本为 Ubuntu 24.04.4 LTS。当前小版本高于 24.04.4 属于正常的系统更新结果，不算错误。
      - 任务三：虚拟机应有以 192.168、172 或 10 开头的私有 IP 和包含 default via 的默认路由；ping IP 和 ping 域名均成功；sudo apt update 使用国内镜像源（如 mirrors.tuna.tsinghua.edu.cn、mirrors.aliyun.com、mirrors.ustc.edu.cn）且没有 Err 或 Failed。若网络禁止 ping 但 apt update 成功，并在表格中说明情况，可判为合格。
      - 任务四：虚拟 CPU 至少 2 核、内存至少 4GB、虚磁盘至少 40GB，且与所选配置档位一致。内存和根分区显示值略小于设置值属于正常现象，不算错误。
      - 任务五：open-vm-tools 为 active；ssh 和 rsyslog 均为 enabled 且 active；系统正在监听 TCP 22 端口；/var/log/syslog 中存在带本人学号姓名的 lab1-check 测试日志。
      - 环境验收总结表的每一行只需给出明确结论；遇到的问题、解决方法及能否继续实验，应在表格后的说明段统一填写，不要求在每一行重复。只要前文任务表已填写且与总结一致，不得因总结表未重复 IP 地址、镜像站域名或配置档位而判为不合格。
    vision_review_points:
      - 截图必须是学生本人环境的电脑截图，终端截图需同时显示命令和输出，文字清晰可读。出现手机拍摄屏幕的反光、摩尔纹或明显倾斜时判为不合格。
  Lab2:
    deadline: "2026-09-17T23:59:59+08:00"
    report_template: homework/Lab2/Lab2.md
    required_files:
      - Lab2.md
      - imgs/lab2_ssh_login.png
      - imgs/lab2_log_inventory.png
      - imgs/lab2_journal_queries.png
    vision_files:
      - imgs/lab2_ssh_login.png
      - imgs/lab2_log_inventory.png
      - imgs/lab2_journal_queries.png
    review_points:
      - 环境检查：journald、rsyslog 均为 active；系统日期时间正确，时区为 Asia/Shanghai，并记录时间同步状态；/var/log/syslog 和 /var/log/auth.log 均存在。报告应填写实际检查结果。
      - SSH 登录：记录 Ubuntu 用户名、虚拟机私有 IPv4 地址、SSH 服务 active、TCP 22 端口监听结果；通过 Windows Git Bash 成功登录 Ubuntu，并填写登录后的 whoami、hostname、pwd 结果。用户名、主机名、IP 和目录应按学生实际环境填写，不要求等于模板中的示例值；截图中的连接与验证结果由图片阶段审核。
      - 日志盘点：表格应登记 5 个真实存在的日志文件或目录，填写各自用途、文本或二进制或目录类型及正确读取命令。不存在的路径不计入 5 项，命令名不能当作文件路径；可选其他真实日志，不要求所有示例路径都存在。二进制 journal 应用 journalctl 读取，不能直接 cat。
      - 三类查询：完成 journalctl -n 30 的最近记录查询、用 --since 和 --until 指定实验当天真实时间范围的查询，以及 journalctl -p warning -b 的本次启动严重程度查询。每类应填写一句实际观察；最近记录需说明一条日志的程序或服务及事件，时间范围需记录实际起止时间，严重程度需说明一条记录或无记录提示。时间范围和严重程度查询无匹配记录属于正常情况，如实保留提示并说明即可，不要求制造报错，也不要求沿用模板中的示例日期。
      - 实验小结：用一至三句话说明 /var/log/wtmp 和 /var/log/btmp 是二进制登录数据库，不能直接用 cat 正确解码，应分别使用 last 和 lastb（读取 btmp 通常需要 sudo）。本题只要求回答，不要求额外执行这些工具。
      - 仅审核 3.2 至 3.6 节的必做填写及 3 张截图，不要求 4W1R 分析表。启动周期、内核查询、登录历史试读等选读内容可以保留或删除，无需执行、填写或额外截图；选读工具缺失、数据库不存在或没有记录不影响合格判定。
    vision_review_points:
      - 截图必须来自学生本人环境，使用电脑截图，文字清晰可读，同时显示命令与对应输出，并能辨认本人用户名、主机名或 IP；不得使用手机拍摄屏幕，截图中不得出现密码、私钥或访问令牌。同一任务允许合理拼图或裁剪无关区域，但不能裁掉命令、时间或关键结果。
      - lab2_ssh_login.png 应显示 Git Bash 中的 SSH 连接命令，以及成功登录 Ubuntu 后 whoami、hostname、pwd 三条验证命令及其输出。
      - lab2_log_inventory.png 应显示 /var/log 目录盘点和 file 类型检查的关键输出；个别示例路径不存在可以接受，只要报告盘点表选择了 5 个真实存在的日志文件或目录。
      - lab2_journal_queries.png 应覆盖最近记录、指定时间范围、按严重程度筛选这 3 类必做查询的命令与关键输出。允许拼图和只保留长输出中的代表性记录；无匹配记录时保留真实提示即可，不要求启动周期或内核查询截图。
  Lab3:
    deadline: "2026-09-24T23:59:59+08:00"
    report_template: homework/Lab3/Lab3.md
    required_files:
      - Lab3.md
      - imgs/lab3_ssh_auth.png
      - imgs/lab3_dual_pipeline.png
    vision_files:
      - imgs/lab3_ssh_auth.png
      - imgs/lab3_dual_pipeline.png
    review_points:
      - 环境与身份记录：3.1 节应填写本人实际的 Ubuntu 用户名、虚拟机 IP 和主机名，三项应分别来自 whoami、hostname -I、hostname 的实际输出。用户名、IP、主机名按学生本人环境填写，不要求等于模板中的示例值；示例主机名 ubuntu 不作为正确答案，报告照抄 ubuntu 且未核对本人 hostname 输出时记为未完成。
      - 认证结果表：应填写成功认证与失败认证各一行，每行的日志时间、尝试登录的账号、来源 IP、结果关键词和日志来源五列都要有依据。结果关键词应为 Accepted password 或 Accepted publickey 与 Failed password。来源 IP 应取日志正文中 from 之后的客户端地址，不能把 hostname -I 查到的虚拟机自身地址填进该列（这是本实验最容易混的一处）。学生未产生失败记录，或用一条记录同时充当成功与失败时，记为未完成。
      - 两处日志对照表：3.2 节四行（journal 中是否查到、/var/log/syslog 中是否查到、两处共同字段或正文、两处主要区别）都应填写。两处应指向同一次 logger 写入的同一条消息，正文须含本人学号与姓名；报告显示写入了两次，或正文使用的是模板示例学号姓名时，记为未完成。
      - 三份事件分析：4.1、4.2、4.3 每题都应保留获取命令、日志原文、完整的 4W1R 表（When、Where、Who、What、Result 五格全部填写）和一两句事件解释。日志原文必须是本人环境中的真实记录，沿用第二节或各小题中的格式示例（主机名 ubuntu、学号 20260001、9 月 8 日等）不计入完成。Who 与 What 不能填同一句话：Who 应写出记录日志的程序以及事件涉及的主体（账号、来源地址或写入者），What 应写出该主体做了什么。
      - 缺少字段与结论边界：原文没有的字段（年份、时区、主机名、操作者账号、是否首次安装等）应写“该日志未提供”，不得自行补猜。把日志正文中自己写入的 result=success 说成系统判定的成功，或仅凭一行 Failed password 断定发生了入侵、给出失败原因，都属于超出证据的结论，应指出。4.2 节只要求说明该次认证成功或失败，以及这条记录不能证明什么。
      - 4.3 软件包状态记录：应安装 htop 后从 /var/log/dpkg.log 中选取一条 htop 相关记录，并填写实际日志来源栏。查到的记录日期较早时（说明此前已装过 htop），如实注明情况后继续分析即算完成，不要求重装。读到 status unpacked 时只能写“已解包”，不能写成安装已完成。改选内核记录作为替代来源时，应说明原因并在实际日志来源栏注明。
      - 知识问答：第五节两题都应作答，每题一至三句。第 1 题应说明 systemd-journald 与 rsyslog 各自的职责，并结合 3.2 节结果解释同一条消息为何能在两处保留；第 2 题应说明 Failed password 能证明这次密码认证失败，不能单独证明操作者身份、失败原因或入侵事实。只回答“能”或“不能”、或未结合本次记录作答，记为不完整。
      - 审核范围：只审核第三节至第五节的必做填写、第八节要求的 2 张截图，以及第二节需要时参考的 4W1R 方法。3.2 节的 logger 参数补充、第六节其他日志格式的阅读方法、Lab2 相关回顾均为选读，不要求执行、填写或截图，报告中保留或删除这些内容都不影响合格判定；不得因缺少选读日志（apt/history.log、apt/term.log、kern.log、nginx 访问日志）或未填选读内容而判为不合格。学生在三份分析之外额外分析其他日志可以接受，不因此加分。
    vision_review_points:
      - 截图必须来自学生本人环境，使用电脑截图，文字清晰可读，同时显示命令与对应输出，并能辨认本人账号、学号、主机名或 IP。不得使用手机拍摄屏幕，截图中不得出现密码、私钥或访问令牌。同一任务允许合理拼图或裁剪无关区域，但不能裁掉命令、时间或关键结果。
      - lab3_ssh_auth.png 应显示 3.1 节的查询命令（journalctl -u ssh --since 的时间范围查询，以及筛选 Accepted 与 Failed password 的 auth.log 查询，允许使用第七节的备用查询）及关键输出。两处输出合起来能辨认本人一次成功认证和一次失败认证即可，不要求每一处都同时出现两条记录；优先核对输出中能否辨认本人的用户名或来源地址。
      - lab3_dual_pipeline.png 应显示 3.2 节含本人学号姓名的 logger 命令，以及 journal 与 syslog 两处查询结果，且两处结果包含本人学号姓名。缺少 logger 命令或缺少其中一处查询结果时判为不合格。
      - 截图中的登录账号、主机名、来源 IP 应与报告正文的记录一致；出现明显矛盾（报告填写的账号与截图不同、报告把虚拟机自身地址当作来源 IP 等）应指出。日志时间与报告填写的时间存在差别但内容可对应时属合理差异，不判为不合格。
  Lab4:
    deadline: "2026-10-08T23:59:59+08:00"
    report_template: homework/Lab4/Lab4.md
    required_files:
      - Lab4.md
      - imgs/lab4_rsyslog_conf.png
      - imgs/lab4_target_practice.png
      - imgs/lab4_verify.png
      - imgs/lab4_logrotate_conf.png
      - imgs/lab4_rotate_evidence.png
    vision_files:
      - imgs/lab4_rsyslog_conf.png
      - imgs/lab4_target_practice.png
      - imgs/lab4_verify.png
      - imgs/lab4_logrotate_conf.png
      - imgs/lab4_rotate_evidence.png
    review_points:
      - 任务 1 默认规则解读：3.1 节记录 /etc/rsyslog.d/ 下除 50-default.conf 外实际存在的 .conf 文件即可，不同镜像数量可能不同，按本人环境填写，列得不全不单独扣分。3.2 节两道自检题都应作答，只要方向正确就算完成：第 1 题指出没写 -p 走默认 user.notice、被 *.* 收进 syslog 即可，不要求同时说明 auth 规则只收 auth 与 authpriv；第 2 题指出 sshd 属 authpriv、被 *.*;auth,authpriv.none 里的 none 排除即可。答得简短、用词不精确但方向对，算完成。
      - 任务 2 打靶观察表：第四节先猜表与观察表都建议填写。观察表落点应正确，即 case1 user.info 只进 syslog，case2 auth.info 只进 auth.log，case3 cron.info 只进 syslog，case4 local6.err 进 syslog 且此时没有专属文件。原因列用自己的话说明命中的规则即可，不要求引用规则原文；原因列留空或只写能、不能时判为不完整并在反馈中提醒。个别 case 落点写得不准确时指出即可，不据此判为不合格。学生环境若已有其他 local6 相关规则导致 case4 另有落点，如实说明后不判为不合格。
      - 任务 3 新建 local6 通道：5.1 记录 ps -o user= -C rsyslogd 查到的运行用户即可，用其他方式确认或直接说明 rsyslogd 以 syslog 运行同样接受；若报告未提及目录需要调整属主，在反馈中提醒即可。5.2 规则文件应为 /etc/rsyslog.d/60-loglab-local6.conf，内容为 local6.* 指向 /var/log/loglab/local6.log，这两项是核心，写错或缺失才判为未完成。5.3 应执行 rsyslogd -N1 且无 error，systemctl status rsyslog 为 active。5.4 四处记录都建议填写，缺一两问时判为不完整并指出缺哪一问，不直接判为不合格；其中第 2 问说明同一条消息两处都有是因为同时命中 *.* 与新增的 local6 规则即可，答成因日志被复制一份虽不精确但落到命中多条规则即可。
      - 任务 4 logrotate 配置与演练：6.2 配置块应包含 daily、rotate 7、missingok、notifempty、compress、create 0640 syslog adm 六项，缺其中一项时判为不完整并在反馈中指出，不直接判为不合格；但配置文件整体缺失或路径写错时判为未完成。6.3 应执行 logrotate -d；报出 parent directory has insecure permissions 后按讲义在配置块加 su syslog adm 即算处理正确。未报该提示而基础版配置中没有 su，不判为未完成。是否记录 dry-run 输出中认出 local6.log 不作强制要求。rotate 保留份数等数值按学生本人配置如实填写，不要求等于 7。
      - 任务 5 轮转事故证据链：7.1 与 7.2 两次 ls -li 的 inode 编号都建议填写，看不出编号但明确说明轮转后 inode 变了也算通过；7.1 的先判断若只写了判断未回头对照，在反馈中提醒即可，不据此判为不合格。7.3 应说明 /proc 中 fd 仍指向旧文件且该文件已被删除，后缀是 .1 还是 .1.gz 不影响判定。7.5 记录手动发 HUP 后 test-2 出现在 local6.log 即可。7.6 提到新增 postrotate 与 endscript，或提到新增 su syslog adm、delaycompress 其中一项即可。7.7 记录 test-3 直接写入新的 local6.log。只手动发 HUP 而未把 postrotate 写进配置时，判为不完整并在反馈中说明原因（应把 postrotate 写入配置以固化闭环），不因此判整份作业不合格。
      - 因果与结论边界：7.4 的原因说明落到进程仍持有旧 inode 的文件描述符、日志被写入已删除的文件即可，措辞不精确不扣分；把它写成 logrotate 把日志删除了、或文件权限被改导致写不进去时指出即可。不得把 deleted 现场解释成磁盘故障。仅凭一次轮转后文件为空就断定 rsyslog 服务异常或配置错误，属于超出证据的结论，应指出。报告未涉及的现象不要求补猜，写明未观察或未记录即可。
      - 知识问答：第八节三题都应作答，每题 1 至 3 句。第 1 题说明 facility 表示日志类别、priority 表示严重程度，并指出 mail.err 匹配 err 及以上即可；只把两者写反时指出即可，答成只有 err 属不完整。第 2 题至少说出一个轮转理由即可（如单文件无限增长占用磁盘、旧日志不便归档清理、需要压缩与保留策略、便于按时间切分排查），说出两个及以上更好。第 3 题说明 -d 只演练不执行、-f 无视状态立即强制执行，并说明改完配置先 -d 是为了在不产生副作用的前提下确认配置被正确识别即可，不要求提到用 -f 试错的风险。
      - 审核范围与合理差异：只审核第二节至第八节的必做填写与第十一节要求的 5 张截图。第十节选读内容（PRI 值、@ 与 @@ 与 stop、copytruncate、进阶阅读）不要求执行、填写或截图，报告中保留或删除都不影响合格判定，不得因缺少选读内容判为不合格；学生在必做内容之外额外做实验或分析可以接受，不因此加分。措辞不同、命令顺序调整、输出摘取方式不同都不扣分；主机名、用户名、IP、inode 编号、日志时间按学生本人环境填写，不要求与讲义示例一致。照抄讲义示例值（主机名 ubuntu、inode 262401、日期 Aug 17 等）而明显未核对本人输出时，记为未完成。
      - 整体判定从宽：报告内容真实、核心步骤确实做过并能自证，即判为合格，不因个别记录栏留空、措辞不完整、输出夹带无关行而降级。严格判定只用于三种情况，即以示例值冒充本人结果、未新建 local6 通道、或未复现并修复轮转事故。反馈应逐条列出可改进之处，但未改进本身不构成不合格。
    vision_review_points:
      - 截图总要求：必须是学生本人环境的电脑截图，能看到命令和对应的输出或关键结果。允许合理拼图、裁剪无关区域、只保留长输出中的代表性记录。仅在手机拍摄屏幕，或截图中出现密码、私钥、访问令牌时判为不合格。窗口大小、终端配色、字体、中英文界面、排版不整齐、夹带少量无关输出，都不扣分，也不判为不合格；文字略有模糊但关键命令与结果仍可辨认时同样通过。
      - lab4_rsyslog_conf.png：能看到 /etc/rsyslog.conf 或 /etc/rsyslog.d/50-default.conf 中至少一个文件的查看命令与内容即可通过；能辨认出一条分流规则（auth,authpriv.*、*.*;auth,authpriv.none、kern.* 任一）就足够。不要求两个文件都出现，也不要求出现 $IncludeConfig 或 imuxsock。用 cat、less 还是 nano 查看都不影响判定。
      - lab4_target_practice.png：能看到至少三条 logger -p 命令，以及 syslog 或 auth.log 至少一处 grep 结果即可通过。四条命令或两处查询结果中缺一项时判为不完整并在反馈里指出缺哪一项，不直接判为不合格；允许只截取输出末尾若干行。
      - lab4_verify.png：能看到 /var/log/loglab/local6.log 中的 msg=hello，以及 syslog 或 journalctl 中至少一处的同样结果即可通过。三处齐全更好，缺一处时判为不完整并指出缺哪一处，不直接判为不合格。未显示文件属主与权限的，在反馈中提醒即可，不据此判不合格。
      - lab4_logrotate_conf.png：能看到 /etc/logrotate.d/loglab-local6 的配置内容即可通过；能一并给出 logrotate -d 的输出更好，但完全没有 dry-run 输出时只判为不完整并在反馈中提醒，不直接判为不合格。
      - lab4_rotate_evidence.png：这是本实验的核心证据，应能辨认轮转前后的 inode 对比、deleted 现场、修复后 test-3 的结果。缺其中一项时判为不完整并明确指出缺哪一项。只有核心现象整体缺失（既看不出 inode 变化，也没有 deleted 现场）时才判为不合格；inode 编号是否逐个抄录不作要求。
      - 报告与截图的一致性：不要求 inode 编号、日志时间、主机名逐字一致，方向一致即可（如报告称 inode 变了、截图中确实变了）。报告与截图出现明显矛盾（如报告称已用 postrotate 修复但截图仍停留在手动 HUP 的现场）时指出即可，不因此判不合格。拼图顺序与报告叙述顺序不同属合理差异。
  Lab5:
    deadline: "2026-10-15T23:59:59+08:00"
    report_template: homework/Lab5/Lab5.md
    required_files:
      - Lab5.md
      - imgs/lab5_prepare.png
      - imgs/lab5_loki.png
      - imgs/lab5_alloy.png
      - imgs/lab5_datasource.png
      - imgs/lab5_explore.png
    # 仅对本次新作业启用；已发布的 Lab1 至 Lab4 继续原有审核规则。
    template_metrics:
      enabled: true
      report_file: Lab5.md
      characters: ['#', '-', '*', '`', '|', '>']
      max_file_bytes: 200000
    vision_files:
      - imgs/lab5_prepare.png
      - imgs/lab5_loki.png
      - imgs/lab5_alloy.png
      - imgs/lab5_datasource.png
      - imgs/lab5_explore.png
    review_points:
      - 任务 1：2.3 节应记录 Grafana、Loki、Alloy 的实际安装版本并确认 nginx 已安装；2.4 节应记录 rsyslog 为 active，并在 /var/log/syslog 中找到含本人学号、姓名、action=write_test 和 result=success 的测试日志。采用 logger -p user.notice -t lab3_read，经 Ubuntu 默认规则写入即可；本次不依赖 Lab4，不要求 local6 专用文件、分流规则或轮转修复，也没有另行要求回答 ELK 选型题。版本按学生实际输出填写，不固定为讲义编写时的版本。
      - 任务 2：3.2 节应记录 Loki 服务 active、/ready 返回 ready 和数据目录 /var/lib/loki；如遇启动错误应说明处理，未遇到可写未遇到。只看到软件安装完成或服务 active 不能代替 ready 检查；刚启动时等待后恢复 ready 属正常情况。
      - 任务 3 配置与权限：4.1 至 4.2 节应验证 alloy 用户能读取 /var/log/syslog 和 /var/log/auth.log；能说明 __path__ 决定读取路径、endpoint 中的 url 指向 Loki 接收地址、forward_to 将读到的日志交给 loki.write.local.receiver 发送即可，不要求背诵整个配置。
      - 任务 3 实际查询：4.3 节应重新写入本人日志，通过 Loki API 查到 job=syslog、正文含本人学号姓名、lab3_read 和 action=write_test 的记录；用正文时间与本地最新一条对应，证明是新写入的记录。应记录实际 job 列表、本人日志原文，并回答结果为空时先检查什么。只有 status=success、只有 job 列表、或只查到旧日志不足以证明实时采集成功；不要求 lab=5 或 phase=platform 标记。
      - 任务 4：5.1 至 5.2 节应完成 Loki 数据源连接测试，记录浏览器实际地址，说明 Windows 浏览器访问虚拟机 IP，而同一虚拟机里的 Grafana 访问 Loki 可用 127.0.0.1；Explore 应查到与 API 对应的本人日志并记录 job、host、filename，其中 job=syslog、filename=/var/log/syslog，host 按本人主机填写。
      - 任务 5：第六节应记录按 result=success 筛选的实际结果，说明 job 选择来源、文字条件筛选内容，并查询 auth 中的 sudo 活动。6.3 表格应写出三条可复制的实际 LogQL 及结果摘要，分别查询本人 write_test 日志、本人 success 测试记录、sudo 活动；本人参数应已替换，不得只贴截图。不要求将同一条消息在 loglab 与 syslog 中对照，result=success 是学生自己写入的测试文本，不是平台判断操作成功。
      - 知识问答：第七节三题应作答。第 1 题说明本地有日志而 API 没有时检查 Alloy 读取权限及发送配置或服务日志，API 有而网页没有时检查数据源、时间范围和查询条件；第 2 题分清 rsyslog 写本地文件、Alloy 读取发送、Loki 保存查询、Grafana 展示；第 3 题说明 job 和 HTTP 状态码通常取值较少，完整 URI 可能有大量不同值，全部作为标签会产生过多日志流。允许简短且含义正确的表达。
      - 审核范围：只要求第二至七节的必做记录和第十节列出的五张截图。题目、说明、示例、选读内容及 Markdown 排版须保留，但第九节选读不要求执行、作答或截图；不得因选读未填写而判未完成。不要求 Dashboard、nginx 访问或错误日志、额外软件部署、专门配置 logrotate。平台与配置应保留供后续实验使用。
      - 合理差异：主机名、IP、时间、版本和日志原文以本人真实环境为准，接受含义相同的正确命令及查询写法、代表性输出、简短解释和界面版本差异。以实际写入、采集和查询成功为核心，非关键记录不完整时明确提醒，不因与模板措辞不同判错。模板中的命令示例可以原样保留，只有在答案区把占位符或示例冒充本人结果时才判未完成；数量检查通过也不能代替内容审核。
    vision_review_points:
      - 截图总要求：使用学生本人环境的电脑截图，命令和关键结果清晰可辨，能认出本人账号、学号或主机信息。允许合理拼图、裁剪无关区域、只显示代表性输出，以及不同界面语言和主题；不得使用手机拍屏，不得出现密码、私钥或访问令牌。截图应与报告填写的结果一致。
      - lab5_prepare.png 应显示 syslog 的查询命令、含本人学号姓名及 action=write_test 的测试日志和 Grafana、Loki、Alloy 的版本输出；nginx 安装结果可结合报告确认。无需 local6 文件或 Lab4 的配置截图。
      - lab5_loki.png 应显示 Loki 服务状态检查及 active 输出，以及 /ready 请求和 ready 返回结果。只有安装输出不能代替这两项检查。
      - lab5_alloy.png 应覆盖以 alloy 身份读取 syslog 和 auth.log 的验证、job 查询，以及含本人学号姓名和 action=write_test 的 API 日志结果。允许拼图或截取 JSON 关键部分；只有 success 或来源列表不能证明日志已经采集。日志时间应可与报告中的本地新记录对应。
      - lab5_datasource.png 应显示 Loki 数据源名称、连接地址和连接测试成功的结果。lab5_explore.png 应显示 Loki 数据源、时间范围、实际 LogQL、本人 write_test 日志，以及展开的 job、host、filename 标签；允许通过拼图补全关键信息。
